aid: lets-enhance
name: Let's Enhance
description: Let's Enhance is an AI image enhancement company whose consumer product at letsenhance.io
  upscales, sharpens, denoises and restores photographs up to 512MP, and whose developer platform is
  shipped as Claid.ai — a REST API for AI image editing, generation and image-to-video. The Claid API
  exposes synchronous and asynchronous image editing pipelines, batch processing, direct upload,
  natural-language AI edit, AI fashion models, AI background scene generation, image generation,
  image-to-video, and cloud storage connectors for AWS S3, Google Cloud Storage and web folders. It is
  used by ecommerce, marketplace, real-estate and print-on-demand teams to automate product and listing
  imagery at scale. Authentication is a bearer API key with per-key permission scopes; long-running jobs
  are polled or delivered by HMAC-signed webhooks. Let's Enhance is a Techstars-backed company.
