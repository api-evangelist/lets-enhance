          - $ref: '#/components/schemas/TiffCompressionEnum'
          - $ref: '#/components/schemas/TiffLossyCompressionOptions'
          - $ref: '#/components/schemas/TiffLosslessCompressionOptions'
          description: The TIFF codec supports both lossless and lossy modes of operation, so you can select the one that is appropriate for your goals. Lossy JPEG compression allows you to reduce the size of the image significantly in exchange for some loss of data, reducing the quality of an image. You can specify the amount of loss you are willing to accept. By default it's set to to 75. Lossless LZW (Lempel-Ziv-Welch) compression allows you to save maximum image details in exchange for a significantly increased file size.
