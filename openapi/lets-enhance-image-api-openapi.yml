    FitEnum:
      title: Fit
      enum:
      - crop
      - cover
      - bounds
      - canvas
      - outpaint
      type: string
      description: "Selects the fit mode: \n(Note: All fit modes preserve the original image aspect ratio. Meaning, the image can be cropped but it won't be stretched or squeezed.)\n\n| Value | Description |\n| --- | --- |\n| `\"crop\"` | Scales an image until it fully covers the specified dimensions, the rest gets cropped. Fit `crop` support `\"center\"` and `\"smart\"` modes for cropping.|\n| `\"cover\"` | Resize the image to entirely cover the specified region, making one dimension larger if needed.|\n| `\"bounds\"` | Resize the image to fit entirely within the specified region, making one dimension smaller if needed. |\n| `\"canvas\"` | Input image will be placed on the canvas established by `width` and `height`. Extra space will be filled with the background `color`.|\n| `\"outpaint\"` | Extra space will be generated with the coherent background.|"
    BackgroundBlurOptions:
      title: background blur options
      type: object
      properties:
        selective:
          title: Selective
          allOf:
          - $ref: '#/components/schemas/BackgroundSelectiveOptions'
          description: Allows to select an object to keep on the image and blur the background around it.
        category:
          allOf:
          - $ref: '#/components/schemas/BackgroundCategoryEnum'
          description: "Selects the category of objects on the image: \n\n| Value | Description |\n| --- | --- |\n| `\"general\"` | The category that is suitable for all objects and is used by default.|\n| `\"cars\"` | The advanced category that will have better results for removing the background with cars on foreground.|\n| `\"products\"` | The advanced category that will have better results for background removal of various types of products and groceries.|\n"
        type:
          allOf:
          - $ref: '#/components/schemas/BackgroundBlurTypeEnum'
          description: "Selects the type of blur to be applied to the background: \n\n| Value | Description |\n| --- | --- |\n| `\"regular\"` | Gaussian blur. Creates an effect of laying a translucent material like vellum on top of the image background, is used by default.|\n| `\"lens\"` | Lens blur with linear focus. Mimics the blur applied to a photo when a wide aperture is used to achieve a narrow depth of field, so that the foreground objects stands out.|\n"
          default: regular
        level:
          allOf:
          - $ref: '#/components/schemas/BackgroundBlurLevelEnum'
          description: "Selects the level of blur strength to be applied to the background: \n\n| Value | Description |\n| --- | --- |\n| `\"low\"` | Low blur strength.|\n| `\"medium\"` | Medium blur strength, is used by default.|\n| `\"high\"` | High blur strength.|\n"
