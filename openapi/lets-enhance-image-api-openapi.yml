      properties:
        type:
          title: Type
          enum:
          - lossless
          type: string
          description: Must have value `"lossless"`
      additionalProperties: false
    SceneCreateAPISceneBackgroundEffectIn:
      title: Scene background effect
      required:
      - effect
      type: object
      properties:
        model:
          title: Scene creation model
          allOf:
          - $ref: '#/components/schemas/SceneCreateModelEnum'
          description: Selects the scene creation model. By default, the model is 'v1'.
          default: v1
        effect:
          $ref: '#/components/schemas/SceneEffectEnum'
        color:
          title: Product background coloring
          anyOf:
          - type: string
            title: Color
            description: 'Color as a hexadecimal. Examples: `"#ffffff"`, `"#000000"`.'
          - $ref: '#/components/schemas/ColorEnum'
          description: Color as a hexadecimal.
        view:
          title: Product viewpoint
          allOf:
          - $ref: '#/components/schemas/TemplateViewAutoEnum'
          description: 'The position of the viewpoint relative to the scene


            | Value | Description |

            | --- | --- |

            | `"top"` | The view is top-down, looking down on the scene from above.|

            | `"front"` | The view is horizontal, looking directly on the scene.|

            | `"auto"` | The view is automatically selected.|'
          default: auto
        aspect_ratio:
          title: Scene aspect ratio
          allOf:
          - $ref: '#/components/schemas/SceneAspectRatioEnum'
          description: Aspect ratio of the scene. By default, the aspect ratio is 1:1.
          default: '1:1'
      additionalProperties: false
    TryOnAPIError:
      title: TryOnAPIError
      required:
      - error
      - created_at
      type: object
      properties:
        error:
          title: Error
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    SceneCreateAPISceneTemplateIn:
      title: Template-based scene
      required:
      - template_url
      - view
      type: object
      properties:
        model:
          title: Scene creation model
          allOf:
          - $ref: '#/components/schemas/SceneCreateModelEnum'
          description: Selects the scene creation model. By default, the model is 'v1'.
          default: v1
        template_mode:
          title: Template mode
          allOf:
          - $ref: '#/components/schemas/TemplateModeEnum'
          description: 'Selects how closely the result should match the template.


            | Value | Description |

            | --- | --- |

            | `"transform"` | Template is transformed according to the prompt and color.|

            | `"adjust"` | Template is slightly adjusted to the product and prompt.|| `"lock"` | Template is preserved with maximum detail.|'
          default: transform
        template_url:
          title: Template image file URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the input image. Should be from 1 to 4096 characters. Image must be accessible by our system. Is optional, if `prompt` is specified.
          format: uri
        color:
          title: Color
          type: string
          description: 'Color as a hexadecimal. Examples: `"#ffffff"`, `"#000000"`.'
        view:
          title: Template viewpoint
          allOf:
          - $ref: '#/components/schemas/TemplateViewEnum'
          description: 'The position of the viewpoint relative to the scene


            | Value | Description |

            | --- | --- |

            | `"top"` | The view is top-down, looking down on the scene from above.|

            | `"front"` | The view is horizontal, looking directly on the scene.|'
        prompt:
          title: Text prompt for scene creation
          anyOf:
          - type: string
            minLength: 3
            maxLength: 2048
          - $ref: '#/components/schemas/ScenePromptAdvancedIn'
          description: 'Text prompt that will be used to create the scene. Should be from 3 to 2048 characters. '
        negative_prompt:
          title: Negative text prompt for scene creation
          maxLength: 2048
          minLength: 3
          type: string
          description: 'Text prompt that will exclude things from the scene. Should be from 3 to 2048 characters. '
        steps:
          title: Number of inference steps
          exclusiveMaximum: 50
          minimum: 1
          type: integer
          description: The more inference steps you use, the better the results, but the more steps, the longer it takes to generate. If you want faster results, you can use fewer steps. If you want higher-quality results, you can use more steps. By default each `template_mode` has an optimal `steps` value.
      additionalProperties: false
    WebpCompressionEnum:
      title: WEBP Compression
      enum:
      - lossy
      - lossless
      type: string
      description: "Selects the WEBP compression type: \n\n| Value | Description |\n| --- | --- |\n| `\"lossy\"` | Lossy compression allows you to reduce the size of the image significantly in exchange for some loss of data, reducing the quality of an image.|\n| `\"lossless\"` | Lossless compression allows you to save maximum image details in exchange for a significantly increased file size.|\n"
    Response_GenerateResponse_:
      title: Response[GenerateResponse]
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GenerateResponse'
      description: Wrapper for responses
    TemplateModeEnum:
      title: Template mode
      enum:
      - transform
      - lock
      - adjust
      type: string
      description: 'Selects how closely the result should match the template.


        | Value | Description |

        | --- | --- |

        | `"transform"` | Template is transformed according to the prompt and color.|

        | `"adjust"` | Template is slightly adjusted to the product and prompt.|| `"lock"` | Template is preserved with maximum detail.|'
    Response_AiEditAcceptedResponse_:
      title: Response[AiEditAcceptedResponse]
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AiEditAcceptedResponse'
      description: Wrapper for responses
    OutpaintOptions:
      title: outpaint options
      required:
      - type
      type: object
      properties:
        type:
          title: Type
          enum:
          - outpaint
          type: string
        feathering:
          title: Feathering
          pattern: ^[1-9][0-9]+[%]$|^[0-9][%]$
          type: string
          description: 'Percentage in string format. Examples: `"60%"`, `"200%"`'
          default: 15%
        outpaint_by:
          title: Outpaint By
          type: string
          description: 'The amount of outpainting to be applied to the image. Should be a string with one or two values separated by space. Each value can be in pixels (e.g. `"100px"`) or in percentages (e.g. `"20%"`).

            If two values are provided, the first value is for the width and the second value is for the height.

            If only one value is provided, it will be applied to both width and height.

            If not provided, the outpainting will be applied in one direction only based on `fit.width` and `fit.height`.

            Examples: `"10%"`, `"5% 15%"`, `"5% 0%"`, `"1024px"`, `"1024px 512px"`, `"0px 1024px"`.'
      additionalProperties: false
    FitCropEnum:
      title: Crop
      enum:
      - center
      - smart
      type: string
      description: "Selects the crop mode: \n\n| Value | Description |\n| --- | --- |\n| `\"center\"` | Cropping relative to the center of the image.|\n| `\"smart\"` | Content aware image cropping.|\n"
    GenerativeOptions:
      title: generative transformations options
      type: object
      properties:
        style_transfer:
          title: Style Transfer
          allOf:
          - $ref: '#/components/schemas/StyleTransferOptions'
          description: Apply style from a reference image.
      additionalProperties: false
    AsyncEditRequest:
      title: AsyncEditRequest
      required:
      - input
      - operations
      type: object
      properties:
        input:
          title: Input URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the input image. Should be from 1 to 512 characters. Image must be accessible by our system.
          format: uri
        operations:
          title: Operations
          allOf:
          - $ref: '#/components/schemas/ImageOperations'
          description: Customize the editing workflow so that the output images meet your requirements.
        output:
          title: Output
          anyOf:
          - $ref: '#/components/schemas/ImageOutputOptions'
          - type: string
            minLength: 1
            maxLength: 4096
            format: uri
          description: Customize the result output.
          default:
            format: jpeg
      additionalProperties: false
    AiEditAspectRatio:
      title: AiEditAspectRatio
      enum:
      - '1:1'
      - '2:3'
      - '3:2'
      - '3:4'
      - '4:3'
      - '9:16'
      - '16:9'
      - '9:21'
      - '21:9'
      type: string
      description: An enumeration.
    SceneCreateAPIObjectAbsoluteIn:
      title: SceneCreateAPIObjectAbsoluteIn
      required:
      - image_url
      type: object
      properties:
        image_url:
          title: Object image file URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the input image. Should be from 1 to 4096 characters. Image must be accessible by our system. For better results, the background of the image should be transparent.
          format: uri
        placement_type:
          title: Placement Type
          enum:
          - absolute
          type: string
          description: '`"absolute"` placement type allows to manually specify the absolute position, scale, and rotation degree of the object on a scene.'
          default: absolute
        rotation_degree:
          title: Degree of object rotation
          anyOf:
          - type: number
            minimum: 0
            maximum: 360
          - type: integer
            minimum: 0
            maximum: 360
          description: Degree of object rotation on the scene. By default, the object is not rotated. (i.e. 0.0).
          default: 0
        scale:
          title: Relative object scale
          anyOf:
          - type: integer
            minimum: 0
            maximum: 1
          - type: number
            minimum: 0.01
            maximum: 1
          description: Relative object scale in relation to the scene. By default, the object is scaled to the scene edges. (i.e. 1.0).
          default: 1
        position:
          title: Relative object position
          allOf:
          - $ref: '#/components/schemas/ObjectPosition'
          description: Relative object position on the scene. By default, the object is positioned at the center of the scene (i.e. x=0.5, y=0.5).
          default:
            x: 0.5
            y: 0.5
      additionalProperties: false
    FormatCompressionLevelEnum:
      title: Compression
      enum:
      - fast
      - best
      - optimal
      type: string
      description: "Indicates compression effort. \n\n| Value | Description |\n| --- | --- |\n| `\"fast\"` |  Used to apply minimum compression resulting in a bigger image size but less processing time.|\n| `\"best\"` | Used to apply maximum compression resulting in a smaller image size but more processing time.|\n| `\"optimal\"` | DEFAULT. Used to balance between compression effort and the processing time.|\n"
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: token
      description: "To work with the Claid API, send requests over HTTPS and authenticate using the `Authorization` header in the following format:`Authorization: Bearer <YOUR_API_KEY>`. You do not need to provide a password.\n\nTo get your API key, [sign in to your Claid account](https://claid.ai/login) and click ***Create API key*** button from the ***Overview*** or ***API keys*** pages.\n\nClaid API’s base URL is `https://api.claid.ai/v1/`. All available endpoints are listed in the [Storage](#tag/Storage) and [Image](#tag/Image) sections. \n\n## Bearer\n\nThis API uses OAuth 2.0 [bearer token](https://datatracker.ietf.org/doc/html/rfc6750) (API key) to authorize requests."
externalDocs:
  description: Claid API documentation
  url: https://docs.claid.ai/
