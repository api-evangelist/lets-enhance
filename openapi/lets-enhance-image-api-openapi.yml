    BackgroundBlurLevelEnum:
      title: Background blur strength level
      enum:
      - low
      - medium
      - high
      type: string
      description: "Selects the level of blur strength: \n\n| Value | Description |\n| --- | --- |\n| `\"low\"` | Low blur strength.|\n| `\"medium\"` | Medium blur strength.|\n| `\"high\"` | High blur strength.|\n"
    BackgroundCategoryEnum:
      title: Category of objects
      enum:
      - general
      - cars
      - products
      type: string
      description: "Selects the category of objects on the image: \n\n| Value | Description |\n| --- | --- |\n| `\"general\"` | The category that is suitable for all objects and is used by default.|\n| `\"cars\"` | The advanced category that will have better results for removing the background with cars on foreground.|\n| `\"products\"` | The advanced category that will have better results for background removal of various types of products and groceries.|\n"
    TemplateViewAutoEnum:
      title: Template view direction
      enum:
      - auto
      - top
      - front
      type: string
      description: 'Selects the template view direction.


        | Value | Description |

        | --- | --- |

        | `"top"` | The view is top-down, looking down on the scene from above.|

        | `"front"` | The view is horizontal, looking directly on the scene.|

        | `"auto"` | The view is automatically selected.|'
    TryOnAPIRequestInputOptions:
      title: TryOnAPIRequestInputOptions
      required:
      - clothing
      type: object
      properties:
        model:
          title: Input model URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the human model image. Image must be accessible by our system.
          format: uri
        clothing:
          title: Clothing images URLs
          maxItems: 5
          minItems: 1
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
            format: uri
          description: List of clothing images URLs. Images must be accessible by our system.
      additionalProperties: false
    AvifCompressionEnum:
      title: AVIF Compression
      enum:
      - lossy
      - lossless
      type: string
      description: "Selects the AVIF compression type: \n\n| Value | Description |\n| --- | --- |\n| `\"lossy\"` | Lossy compression allows you to reduce the size of the image significantly in exchange for some loss of data, reducing the quality of an image.|\n| `\"lossless\"` | Lossless compression allows you to save maximum image details in exchange for a significantly increased file size.|\n"
    SceneCreateAPIObjectOriginalIn:
      title: SceneCreateAPIObjectOriginalIn
      required:
      - image_url
      - placement_type
      type: object
      properties:
        image_url:
          title: Object image file URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the input image. Should be from 1 to 4096 characters. Image must be accessible by our system. For better results, the background of the image should be transparent.
          format: uri
        placement_type:
          title: Placement Type
          enum:
          - original
          type: string
          description: '`"original"` placement type instructs to use an object position and scale from the input image, meaning this placement method is fully automated and does not require any additional parameters.'
      additionalProperties: false
    BackgroundBlurTypeEnum:
      title: Type of background blur
      enum:
      - regular
      - lens
      type: string
      description: "Selects the type of blur: \n\n| Value | Description |\n| --- | --- |\n| `\"regular\"` | Gaussian blur. Creates an effect of laying a translucent material like vellum on top of the image background.|\n| `\"lens\"` | Lens blur with linear focus. Mimics the blur applied to a photo when a wide aperture is used to achieve a narrow depth of field, so that the foreground objects stands out.|\n"
    AdjustmentsOptions:
      title: adjustments options
      type: object
      properties:
        hdr:
          title: Hdr
          anyOf:
          - type: integer
            description: HDR effect intensity.
            minimum: 0
            maximum: 100
          - $ref: '#/components/schemas/HdrOptions'
          description: Balances out colors and lighting. Allows to turn on `stitching` for stitched 360 photos.
          default: 0
        exposure:
          title: Exposure
          maximum: 100
          minimum: -100
          type: integer
          description: Decrease (negative integer) or increase (positive integer) exposure.
          default: 0
        saturation:
          title: Saturation
          maximum: 100
          minimum: -100
          type: integer
          description: Decrease (negative integer) or increase (positive integer) saturation.
          default: 0
        contrast:
          title: Contrast
          maximum: 100
          minimum: -100
          type: integer
          description: Decrease (negative integer) or increase (positive integer) contrast.
          default: 0
        sharpness:
          title: Sharpness
          maximum: 100
          minimum: 0
          type: integer
          description: Increase sharpness.
          default: 0
      additionalProperties: false
    WebpLosslessCompressionOptions:
      title: WebpLosslessCompressionOptions
