components:
  schemas:
    AsyncPipelineResultItem:
      title: AsyncPipelineResultItem
      required:
      - input_object
      - output_object
      type: object
      properties:
        input_object:
          $ref: '#/components/schemas/PipelineInputObject'
        output_object:
          $ref: '#/components/schemas/PipelineOutputObject'
    AsyncResultResponse:
      title: AsyncResultResponse
      required:
      - id
      - status
      - created_at
      - request
      type: object
      properties:
        id:
          title: Id
          type: integer
        status:
          $ref: '#/components/schemas/APIV1Status'
        result_url:
          title: Result Url
          maxLength: 65536
          minLength: 1
          type: string
          format: uri
        created_at:
          title: Created At
          type: string
          format: date-time
        request:
          title: Request
          anyOf:
          - $ref: '#/components/schemas/BatchEditRequest'
          - $ref: '#/components/schemas/AsyncEditRequest'
          - type: object
        errors:
          title: Errors
          type: array
          items:
            $ref: '#/components/schemas/BatchPipelineError'
          default: []
        result:
          title: Result
          allOf:
          - $ref: '#/components/schemas/AsyncPipelineResultItem'
          default: {}
    TryOnAPIRequest:
      title: TryOnAPIRequest
      required:
      - input
      - options
      type: object
      properties:
        output:
          title: Output
          anyOf:
          - $ref: '#/components/schemas/TryOnAPIRequestOutputObject'
          - type: string
            minLength: 1
            maxLength: 4096
            format: uri
          description: Customize output format, destination and number of images.
          default:
            number_of_images: 1
            format: png
        input:
          title: Input
          allOf:
          - $ref: '#/components/schemas/TryOnAPIRequestInputOptions'
          description: Input model and clothing images for the generation.
        options:
          title: Options
          allOf:
          - $ref: '#/components/schemas/TryOnAPIRequestOptionsObject'
          description: Customize the generation.
      additionalProperties: false
    BatchEditInputOptions:
      title: image input options
      required:
      - source
      type: object
      properties:
        source:
          title: Input folder URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the input file or folder. Should be from 1 to 512 characters. Must be accessible by our system.
          format: uri
        recursive:
          title: Recursive
          type: boolean
          description: 'If `true`, recursively processes all images in subfolders as well, works only if source is folder. '
          default: false
      additionalProperties: false
    PipelineInputObject:
      title: PipelineInputObject
      required:
      - ext
      - mps
      - mime
      - format
      - width
      - height
      type: object
      properties:
        ext:
          title: Ext
          type: string
          description: 'File extension. Can have values: `"jpg"`, `"png"`, `"avif"`'
        mps:
          title: Mps
          type: number
          description: Megapixel count
        mime:
          title: Mime
          type: string
          description: MIME type (also known as ‘media type’)
        format:
          title: Format
          type: string
          description: 'File format. Can have values: `"jpeg"`, `"png"`, `"avif"`'
        width:
          title: Width
          type: integer
          description: Image width in pixels
        height:
          title: Height
          type: integer
          description: Image height in pixels
    AiEditError:
      title: AiEditError
      required:
      - error
      - created_at
      type: object
      properties:
        error:
          title: Error
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
    PipelineInputObjectInError:
      title: PipelineInputObjectInError
      required:
      - ext
      - mps
      - mime
      - format
      - width
      - height
      type: object
      properties:
        ext:
          title: Ext
          type: string
          description: 'File extension. Can have values: `"jpg"`, `"png"`, `"avif"`'
        mps:
          title: Mps
          type: number
          description: Megapixel count
        mime:
          title: Mime
          type: string
          description: MIME type (also known as ‘media type’)
        format:
          title: Format
          type: string
          description: 'File format. Can have values: `"jpeg"`, `"png"`, `"avif"`'
        width:
          title: Width
          type: integer
          description: Image width in pixels
        height:
          title: Height
          type: integer
          description: Image height in pixels
    CropOptions:
      title: crop options
      required:
      - type
      type: object
      properties:
        type:
          title: Type
          enum:
          - crop
          type: string
        crop:
          title: Crop mode
          allOf:
          - $ref: '#/components/schemas/FitCropEnum'
          description: "Selects the crop mode: \n\n| Value | Description |\n| --- | --- |\n| `\"center\"` | Cropping relative to the center of the image.|\n| `\"smart\"` | Content aware image cropping.|\n"
          default: center
      additionalProperties: false
    EditResponse:
      title: EditResponse
      required:
      - input
      - output
      type: object
      properties:
        input:
          $ref: '#/components/schemas/PipelineInputObject'
        output:
          $ref: '#/components/schemas/PipelineOutputObject'
        profiling:
          title: Profiling
          type: object
    SceneCreateAPIObjectPaddingIn:
      title: SceneCreateAPIObjectPaddingIn
      required:
      - image_url
      - placement_type
      - padding
      type: object
      properties:
        image_url:
          title: Object image file URL
          maxLength: 4096
          minLength: 1
          type: string
          description: URL of the input image. Should be from 1 to 4096 characters. Image must be accessible by our system. For better results, the background of the image should be transparent.
          format: uri
        placement_type:
          title: Placement Type
          enum:
          - padding
          type: string
          description: '`"padding"` placement type allows to add a space around the object equally to each of 4 sides, or for height&width separately.'
        padding:
          title: Padding around the object
          type: string
          description: Add a space around the object equally to each of 4 sides, or for height&width separately. Can not be bigger than half of image width/height.
      additionalProperties: false
    TryOnAPIAcceptedResponse:
      title: TryOnAPIAcceptedResponse
      required:
      - id
      - status
      - created_at
      - request
      - result_url
      type: object
      properties:
        id:
          title: Id
          type: integer
        status:
          $ref: '#/components/schemas/APIV1Status'
        created_at:
          title: Created At
          type: string
          format: date-time
        request:
          title: Request
          type: object
        result_url:
          title: Result Url
          maxLength: 65536
          minLength: 1
          type: string
          format: uri
    ScenePipelineResponseOut:
      title: ScenePipelineResponseOut
      required:
      - input
      - output
      type: object
      properties:
        input:
          $ref: '#/components/schemas/PipelineInputObject'
        output:
          title: Output
          type: array
          items:
            $ref: '#/components/schemas/PipelineOutputObject'
        profiling:
          title: Profiling
          type: object
    TiffLossyCompressionOptions:
      title: TiffLossyCompressionOptions
      required:
      - type
      type: object
      properties:
        type:
          title: Type
          enum:
          - lossy
          type: string
          description: Must have value `"lossy"`
        quality:
          title: Quality
          maximum: 100
          minimum: 1
          type: integer
          default: 75
      additionalProperties: false
    SceneEffectEnum:
      title: Additional scene effect
      enum:
      - shadows
      type: string
      description: 'Selects the scene effect.


        | Value | Description |

        | --- | --- |

        | `"shadows"` | Apply shadow generation on the image.|

        '
    ColorEnum:
      title: Transparent
      enum:
      - transparent
      type: string
